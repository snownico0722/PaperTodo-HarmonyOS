name: Capsule repair workspace

on:
  push:
    branches: ['fix/capsule-readiness-20260905']
    paths: ['.github/workflows/capsule-repair-workspace.yml']

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/capsule-readiness-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/capsule-readiness-20260905
      - name: Verify and apply the reviewed workspace patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          parts = [Path('.github/repair-parts') / (str(i) + '.txt') for i in range(5)]
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text() for p in parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '69099576e6c974e3e9202e45b7e0c61b3e988c08da8907193fd288421e74f4fe', 'Repair patch checksum mismatch'
          Path(os.environ['RUNNER_TEMP'], 'capsule-fix.patch').write_bytes(patch)
          PY
          git apply --check --exclude=.github/workflows/capsule-regression.yml "$RUNNER_TEMP/capsule-fix.patch"
          git apply --exclude=.github/workflows/capsule-regression.yml "$RUNNER_TEMP/capsule-fix.patch"
          rm -rf .github/repair-parts
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts AppScope CHANGELOG.md README.md docs entry .github/repair-parts
          git commit -m 'fix: gate capsule handoff on readiness and preserve recoverability'
          git push origin HEAD:refs/heads/fix/capsule-readiness-20260905
      # The branch-only helper is deleted through the repository connector after
      # this job; no signing credentials or protected release paths are used.
