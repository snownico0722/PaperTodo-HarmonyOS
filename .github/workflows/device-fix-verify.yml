name: Verify HarmonyOS PC device fixes

on:
  push:
    branches:
      - fix/device-capsule-toolbar-taskbar

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache HarmonyOS Command Line Tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: command-line-tools
          key: ${{ runner.os }}-harmonyos-cli-6.1.0.816
          save-always: true

      - name: Download HarmonyOS Command Line Tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 \
            --output tools.zip \
            https://github.com/Okysu/harmony-auto-build/releases/download/commandline-tools-linux-x64-6.1.0.816/commandline-tools-linux-x64-6.1.0.816.zip
          echo "4b21e8a4ce19fc7eb381425a570e936c80067b8a0bef9cdcfe8a49e4764038e2  tools.zip" | sha256sum --check -
          unzip -q tools.zip
          rm tools.zip

      - name: Setup HarmonyOS build environment
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_DIR="$GITHUB_WORKSPACE/command-line-tools"
          echo "hwsdk.dir=$TOOLS_DIR/sdk" > local.properties
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "OHPM_HOME=$TOOLS_DIR/ohpm" >> "$GITHUB_ENV"
          echo "HOS_SDK_HOME=$TOOLS_DIR/sdk" >> "$GITHUB_ENV"
          chmod -R +x "$TOOLS_DIR/bin"

      - name: Install dependencies
        run: ohpm install

      - name: Build debug HAP
        run: hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon

      - name: Upload debug HAP
        uses: actions/upload-artifact@v4
        with:
          name: papertodo-harmonyos-device-fix-debug
          if-no-files-found: error
          path: '**/build/**/outputs/**/*.hap'

      - name: Remove one-shot workflow after successful build
        shell: bash
        run: |
          git config user.name "PaperTodo CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/device-fix-verify.yml
          git commit -m "chore: finish device-fix verification"
          git push origin HEAD:fix/device-capsule-toolbar-taskbar
