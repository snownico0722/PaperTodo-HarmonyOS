name: V333 Source Patch
on:
  push:
    branches:
      - fix/device-regressions-v333
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hide cross-paper drag handle
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('entry/src/main/ets/pages/Paper.ets')
          text = path.read_text()

          marker = """interface ClipboardImageCandidate {
            pixelMap?: image.PixelMap;
            uri?: string;
          }
          """
          replacement = marker + """
          // Cross-window drag association is temporarily hidden on HarmonyOS PC.
          // Existing links and non-drag association paths stay intact.
          const SHOW_PAPER_LINK_DRAG_HANDLE: boolean = false;
          """
          if 'const SHOW_PAPER_LINK_DRAG_HANDLE' not in text:
              if marker not in text:
                  raise SystemExit('ClipboardImageCandidate marker not found')
              text = text.replace(marker, replacement, 1)

          old = """    if (this.enablePaperLinks) {
                count += 1;
              }
          """
          new = """    if (SHOW_PAPER_LINK_DRAG_HANDLE && this.enablePaperLinks) {
                count += 1;
              }
          """
          if old not in text:
              raise SystemExit('topBarActionItemCount branch not found')
          text = text.replace(old, new, 1)

          old = """    if (this.enablePaperLinks) {
                width += 26;
              }
          """
          new = """    if (SHOW_PAPER_LINK_DRAG_HANDLE && this.enablePaperLinks) {
                width += 26;
              }
          """
          if old not in text:
              raise SystemExit('topBarActionGroupWidth branch not found')
          text = text.replace(old, new, 1)

          header = text.find('  private HeaderBar() {')
          if header < 0:
              raise SystemExit('HeaderBar not found')
          drag_branch = text.find('          if (this.enablePaperLinks) {', header)
          if drag_branch < 0:
              raise SystemExit('HeaderBar drag branch not found')
          text = text[:drag_branch] + text[drag_branch:].replace(
              '          if (this.enablePaperLinks) {',
              '          if (SHOW_PAPER_LINK_DRAG_HANDLE && this.enablePaperLinks) {',
              1)

          path.write_text(text)
          PY
          git diff --check -- entry/src/main/ets/pages/Paper.ets
      - name: Commit UI cleanup
        shell: bash
        run: |
          git config user.name "PaperTodo CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/v333-source-patch.yml
          git add entry/src/main/ets/pages/Paper.ets
          git commit -m "hide unavailable cross-paper drag handle"
          git push origin HEAD:fix/device-regressions-v333
