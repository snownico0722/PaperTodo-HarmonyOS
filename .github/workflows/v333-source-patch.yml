name: V333 Source Patch
on:
  push:
    branches:
      - fix/device-regressions-v333
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -c "import base64;exec(base64.b64decode(''))"
      - run: git diff --check
      - run: git config user.name "PaperTodo CI" && git config user.email "actions@users.noreply.github.com" && git rm .github/workflows/v333-source-patch.yml && git add entry/src/main/ets/pages/Paper.ets CHANGELOG.md && git commit -m "fix: hide unavailable cross-paper drag handle" && git push origin HEAD:fix/device-regressions-v333
