name: V334 Keytool CSR Patch

on:
  push:
    branches:
      - fix/v334-keytool-csr

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch persistent signing CSR generation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/agc-release-sign.sh')
          text = path.read_text()
          old = "\n".join([
              '  derive_persistent_release_key "$key_file"',
              '  openssl req -new -sha256 -key "$key_file" \\',
              '    -subj "/C=CN/O=PaperTodo/OU=Release/CN=$STABLE_KEY_ALIAS" \\',
              '    -out "$csr"',
              ''
          ])
          new = "\n".join([
              '  derive_persistent_release_key "$key_file"',
              '',
              '  # AGC certificate requests have been proven with keytool PKCS#10 output.',
              '  # Keep the persistent private key, but let keytool generate the CSR.',
              '  local bootstrap_certificate="$SIGN_DIR/release-bootstrap-cert.pem"',
              '  openssl req -new -x509 -sha256 -days 3650 \\',
              '    -key "$key_file" \\',
              '    -subj "/C=CN/O=PaperTodo/OU=Release/CN=$STABLE_KEY_ALIAS" \\',
              '    -out "$bootstrap_certificate"',
              '  openssl pkcs12 -export \\',
              '    -name "$STABLE_KEY_ALIAS" \\',
              '    -inkey "$key_file" \\',
              '    -in "$bootstrap_certificate" \\',
              '    -out "$keystore" \\',
              '    -passout "pass:$keystore_password"',
              '  keytool -certreq \\',
              '    -alias "$STABLE_KEY_ALIAS" \\',
              '    -sigalg SHA256withECDSA \\',
              '    -keystore "$keystore" \\',
              '    -storetype pkcs12 \\',
              '    -storepass "$keystore_password" \\',
              '    -keypass "$keystore_password" \\',
              '    -file "$csr"',
              ''
          ])
          if old not in text:
              raise SystemExit('sign_release CSR marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PaperTodo CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/v334-keytool-csr-patch.yml
          git add .github/scripts/agc-release-sign.sh
          git diff --check
          git commit -m "ci: use keytool CSR for persistent AGC identity"
          git push origin HEAD:fix/v334-keytool-csr
