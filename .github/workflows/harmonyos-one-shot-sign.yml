name: HarmonyOS One Shot Sign

on:
  pull_request:
    branches:
      - main

concurrency:
  group: harmonyos-one-shot-sign-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sign:
    name: Build and sign release APP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cleanup old PaperTodo test signing resources
        shell: bash
        env:
          AGC_SERVICE_ACCOUNT_JSON: ${{ secrets.AGC_SERVICE_ACCOUNT_JSON }}
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
        run: |
          set -euo pipefail
          [[ -n "${AGC_SERVICE_ACCOUNT_JSON:-}" && -n "${AGC_APP_ID:-}" ]]

          JWT="$(node <<'NODE'
          const crypto = require('crypto');
          const a = JSON.parse(process.env.AGC_SERVICE_ACCOUNT_JSON);
          const now = Math.floor(Date.now() / 1000);
          const b64 = v => Buffer.from(JSON.stringify(v)).toString('base64url');
          const input = `${b64({kid:a.key_id,typ:'JWT',alg:'PS256'})}.${b64({iss:a.sub_account,aud:'https://oauth-login.cloud.huawei.com/oauth2/v3/token',iat:now,exp:now+3600})}`;
          const sig = crypto.sign('sha256', Buffer.from(input), {key:a.private_key,padding:crypto.constants.RSA_PKCS1_PSS_PADDING,saltLength:32});
          process.stdout.write(`${input}.${sig.toString('base64url')}`);
          NODE
          )"
          echo "::add-mask::$JWT"

          PROFILE_LIST="$RUNNER_TEMP/papertodo-profile-list.json"
          STATUS="$(curl -sS -o "$PROFILE_LIST" -w '%{http_code}' \
            -H "Authorization: Bearer $JWT" -H "appId: $AGC_APP_ID" -H 'Content-Type: application/json' \
            'https://connect-api.cloud.huawei.com/api/publish/v3/provision/list?fromRecCount=1&maxReqCount=100')"
          [[ "$STATUS" == 200 && "$(jq -r '.ret.code // -1' "$PROFILE_LIST")" == 0 ]]
          mapfile -t PROFILE_IDS < <(jq -r '.provisionList[]? | select((.provisionName // "") | startswith("PaperTodo-Test-")) | .id' "$PROFILE_LIST" | sort -u)
          echo "PaperTodo test profiles found: ${#PROFILE_IDS[@]}"
          for id in "${PROFILE_IDS[@]}"; do
            BODY="$RUNNER_TEMP/delete-profile-$id.json"
            STATUS="$(curl -sS -o "$BODY" -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $JWT" -H 'Content-Type: application/json' \
              "https://connect-api.cloud.huawei.com/api/publish/v2/provision?id=$id")"
            CODE="$(jq -r '.ret.code // -1' "$BODY")"
            [[ "$STATUS" == 200 && "$CODE" == 0 ]]
            echo "Deleted PaperTodo test profile: $id"
          done

          CERT_LIST="$RUNNER_TEMP/papertodo-cert-list.json"
          CERT_OK=0
          for PAYLOAD in \
            '{"certType":2,"fromRecCount":1,"maxReqCount":100}' \
            '{"fromRecCount":1,"maxReqCount":100}' \
            '{}'; do
            STATUS="$(curl -sS -o "$CERT_LIST" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $JWT" -H 'Content-Type: application/json' \
              --data "$PAYLOAD" 'https://connect-api.cloud.huawei.com/api/publish/v3/cert/list')"
            CODE="$(jq -r '.ret.code // -1' "$CERT_LIST" 2>/dev/null || echo -1)"
            if [[ "$STATUS" == 200 && "$CODE" == 0 ]]; then
              CERT_OK=1
              break
            fi
          done
          if [[ "$CERT_OK" != 1 ]]; then
            echo "AGC certificate-list query failed: HTTP=$STATUS code=$(jq -r '.ret.code // -1' "$CERT_LIST" 2>/dev/null || echo -1) msg=$(jq -r '.ret.msg // ""' "$CERT_LIST" 2>/dev/null || true)" >&2
            exit 1
          fi

          mapfile -t CERT_IDS < <(jq -r '.. | objects | select(((.certName? // "") | startswith("PaperTodo-Test-"))) | (.id? // .certId? // empty)' "$CERT_LIST" | sort -u)
          echo "PaperTodo test certificates found: ${#CERT_IDS[@]}"
          if [[ ${#CERT_IDS[@]} -gt 0 ]]; then
            DELETE_CERTS="$RUNNER_TEMP/delete-certs.json"
            CERT_DELETE_REQUEST="$(printf '%s\n' "${CERT_IDS[@]}" | jq -R . | jq -s '{certIds:.}')"
            STATUS="$(curl -sS -o "$DELETE_CERTS" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $JWT" -H 'Content-Type: application/json' \
              --data "$CERT_DELETE_REQUEST" 'https://connect-api.cloud.huawei.com/api/publish/v2/cert/delete')"
            CODE="$(jq -r '.ret.code // -1' "$DELETE_CERTS")"
            [[ "$STATUS" == 200 && "$CODE" == 0 ]]
            echo "Deleted ${#CERT_IDS[@]} PaperTodo test certificates."
          fi

      - name: Cache HarmonyOS Command Line Tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: command-line-tools
          key: ${{ runner.os }}-harmonyos-cli-6.1.0.816

      - name: Download HarmonyOS Command Line Tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 --output tools.zip https://github.com/Okysu/harmony-auto-build/releases/download/commandline-tools-linux-x64-6.1.0.816/commandline-tools-linux-x64-6.1.0.816.zip
          echo "4b21e8a4ce19fc7eb381425a570e936c80067b8a0bef9cdcfe8a49e4764038e2  tools.zip" | sha256sum --check -
          unzip -q tools.zip
          rm tools.zip

      - name: Setup HarmonyOS build environment
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_DIR="$GITHUB_WORKSPACE/command-line-tools"
          echo "hwsdk.dir=$TOOLS_DIR/sdk" > local.properties
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "OHPM_HOME=$TOOLS_DIR/ohpm" >> "$GITHUB_ENV"
          echo "HOS_SDK_HOME=$TOOLS_DIR/sdk" >> "$GITHUB_ENV"
          chmod -R +x "$TOOLS_DIR/bin"

      - name: Install dependencies
        run: ohpm install

      - name: Assemble release APP
        run: hvigorw assembleApp --mode project -p product=default -p buildMode=release -p enableSignTask=false --no-daemon

      - name: Create AGC release certificate/profile and sign
        shell: bash
        env:
          AGC_SERVICE_ACCOUNT_JSON: ${{ secrets.AGC_SERVICE_ACCOUNT_JSON }}
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          SIGN_DIR="$RUNNER_TEMP/papertodo-signing"
          mkdir -p "$SIGN_DIR" package
          KEY_ALIAS='papertodo_test_release'
          KEYSTORE_PASSWORD="Pt-$(openssl rand -hex 16)-9A"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          KEYSTORE="$SIGN_DIR/test.p12"
          CSR_FILE="$SIGN_DIR/test.csr"
          CERT_FILE="$SIGN_DIR/test.cer"
          PROFILE_FILE="$SIGN_DIR/test.p7b"
          keytool -genkeypair -alias "$KEY_ALIAS" -keyalg EC -groupname secp256r1 -sigalg SHA256withECDSA -dname "C=CN,O=PaperTodo,OU=GitHub CI,CN=$KEY_ALIAS" -keystore "$KEYSTORE" -storetype pkcs12 -validity 9125 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -noprompt
          keytool -certreq -alias "$KEY_ALIAS" -sigalg SHA256withECDSA -keystore "$KEYSTORE" -storetype pkcs12 -storepass "$KEYSTORE_PASSWORD" -file "$CSR_FILE"

          JWT="$(node <<'NODE'
          const crypto = require('crypto');
          const a = JSON.parse(process.env.AGC_SERVICE_ACCOUNT_JSON);
          const now = Math.floor(Date.now() / 1000);
          const b64 = v => Buffer.from(JSON.stringify(v)).toString('base64url');
          const input = `${b64({kid:a.key_id,typ:'JWT',alg:'PS256'})}.${b64({iss:a.sub_account,aud:'https://oauth-login.cloud.huawei.com/oauth2/v3/token',iat:now,exp:now+3600})}`;
          const sig = crypto.sign('sha256', Buffer.from(input), {key:a.private_key,padding:crypto.constants.RSA_PKCS1_PSS_PADDING,saltLength:32});
          process.stdout.write(`${input}.${sig.toString('base64url')}`);
          NODE
          )"
          echo "::add-mask::$JWT"
          SUFFIX="${SOURCE_SHA:0:7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          CERT_RESPONSE="$SIGN_DIR/cert.json"
          CERT_REQUEST="$(jq -n --rawfile csr "$CSR_FILE" --arg certName "PaperTodo-Test-$SUFFIX" '{csr:$csr,certName:$certName,certType:2}')"
          STATUS="$(curl -sS -o "$CERT_RESPONSE" -w '%{http_code}' -X POST -H "Authorization: Bearer $JWT" -H 'Content-Type: application/json' --data "$CERT_REQUEST" 'https://connect-api.cloud.huawei.com/api/publish/v3/cert')"
          if [[ "$STATUS" != 200 || "$(jq -r '.ret.code // -1' "$CERT_RESPONSE")" != 0 ]]; then
            echo "AGC certificate create failed: HTTP=$STATUS code=$(jq -r '.ret.code // -1' "$CERT_RESPONSE") msg=$(jq -r '.ret.msg // ""' "$CERT_RESPONSE")" >&2
            exit 1
          fi
          CERT_ID="$(jq -r '.certInfo.id // empty' "$CERT_RESPONSE")"
          CERT_URL="$(jq -r '.certInfo.certDownloadUrl // empty' "$CERT_RESPONSE")"
          curl -fLsS "$CERT_URL" -o "$CERT_FILE"

          PROFILE_RESPONSE="$SIGN_DIR/profile.json"
          PROFILE_REQUEST="$(jq -n --arg provisionName "PaperTodo-Test-$SUFFIX" --arg certId "$CERT_ID" --arg appId "$AGC_APP_ID" '{provisionName:$provisionName,provisionType:2,certId:$certId,appId:$appId}')"
          STATUS="$(curl -sS -o "$PROFILE_RESPONSE" -w '%{http_code}' -X POST -H "Authorization: Bearer $JWT" -H 'Content-Type: application/json' --data "$PROFILE_REQUEST" 'https://connect-api.cloud.huawei.com/api/publish/v3/provision')"
          if [[ "$STATUS" != 200 || "$(jq -r '.ret.code // -1' "$PROFILE_RESPONSE")" != 0 ]]; then
            echo "AGC profile create failed: HTTP=$STATUS code=$(jq -r '.ret.code // -1' "$PROFILE_RESPONSE") msg=$(jq -r '.ret.msg // ""' "$PROFILE_RESPONSE")" >&2
            exit 1
          fi
          PROFILE_URL="$(jq -r '.provisionInfo.provisionDownloadUrl // empty' "$PROFILE_RESPONSE")"
          curl -fLsS "$PROFILE_URL" -o "$PROFILE_FILE"

          SIGN_TOOL="$(find "$HOS_SDK_HOME" -type f \( -name 'hap-sign-tool.jar' -o -name 'hap_sign_tool.jar' \) -print | head -n1)"
          UNSIGNED_APP="$(find . -type f -name '*-unsigned.app' -path '*/build/*' -print | head -n1)"
          OUT="package/PaperTodo-HarmonyOS-${SOURCE_SHA:0:7}-release-signed.app"
          java -jar "$SIGN_TOOL" sign-app -keyAlias "$KEY_ALIAS" -signAlg SHA256withECDSA -mode localSign -appCertFile "$CERT_FILE" -profileFile "$PROFILE_FILE" -inFile "$UNSIGNED_APP" -keystoreFile "$KEYSTORE" -outFile "$OUT" -keyPwd "$KEYSTORE_PASSWORD" -keystorePwd "$KEYSTORE_PASSWORD" -signCode 1
          java -jar "$SIGN_TOOL" verify-app -inFile "$OUT" -outCertChain "$SIGN_DIR/verified.cer" -outProfile "$SIGN_DIR/verified.p7b"
          sha256sum "$OUT" | tee package/SHA256SUMS

      - name: Upload signed test APP
        uses: actions/upload-artifact@v4
        with:
          name: PaperTodo-HarmonyOS-window-host-refactor-final-signed-test
          retention-days: 1
          if-no-files-found: error
          path: |
            package/*-release-signed.app
            package/SHA256SUMS
