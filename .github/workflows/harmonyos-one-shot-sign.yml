name: HarmonyOS One Shot Sign

on:
  pull_request:
    branches:
      - main

concurrency:
  group: harmonyos-one-shot-sign-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sign:
    name: Build and sign release APP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache HarmonyOS Command Line Tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: command-line-tools
          key: ${{ runner.os }}-harmonyos-cli-6.1.0.816

      - name: Download HarmonyOS Command Line Tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 \
            --output tools.zip \
            https://github.com/Okysu/harmony-auto-build/releases/download/commandline-tools-linux-x64-6.1.0.816/commandline-tools-linux-x64-6.1.0.816.zip
          echo "4b21e8a4ce19fc7eb381425a570e936c80067b8a0bef9cdcfe8a49e4764038e2  tools.zip" | sha256sum --check -
          unzip -q tools.zip
          rm tools.zip

      - name: Setup HarmonyOS build environment
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_DIR="$GITHUB_WORKSPACE/command-line-tools"
          echo "hwsdk.dir=$TOOLS_DIR/sdk" > local.properties
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "OHPM_HOME=$TOOLS_DIR/ohpm" >> "$GITHUB_ENV"
          echo "HOS_SDK_HOME=$TOOLS_DIR/sdk" >> "$GITHUB_ENV"
          chmod -R +x "$TOOLS_DIR/bin"

      - name: Install dependencies
        run: ohpm install

      - name: Assemble release APP
        run: hvigorw assembleApp --mode project -p product=default -p buildMode=release -p enableSignTask=false --no-daemon

      - name: Create AGC release certificate/profile and sign
        shell: bash
        env:
          AGC_SERVICE_ACCOUNT_JSON: ${{ secrets.AGC_SERVICE_ACCOUNT_JSON }}
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ -n "${AGC_SERVICE_ACCOUNT_JSON:-}" && -n "${AGC_APP_ID:-}" ]]

          SIGN_DIR="$RUNNER_TEMP/papertodo-signing"
          mkdir -p "$SIGN_DIR" package
          KEY_ALIAS='papertodo_test_release'
          KEYSTORE_PASSWORD="Pt-$(openssl rand -hex 16)-9A"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          KEYSTORE="$SIGN_DIR/papertodo-test.p12"
          CSR_FILE="$SIGN_DIR/papertodo-test.csr"
          CERT_FILE="$SIGN_DIR/papertodo-test.cer"
          PROFILE_FILE="$SIGN_DIR/papertodo-test.p7b"

          keytool -genkeypair \
            -alias "$KEY_ALIAS" \
            -keyalg EC \
            -groupname secp256r1 \
            -sigalg SHA256withECDSA \
            -dname "C=CN,O=PaperTodo,OU=GitHub CI,CN=$KEY_ALIAS" \
            -keystore "$KEYSTORE" \
            -storetype pkcs12 \
            -validity 9125 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -noprompt
          keytool -certreq \
            -alias "$KEY_ALIAS" \
            -sigalg SHA256withECDSA \
            -keystore "$KEYSTORE" \
            -storetype pkcs12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -file "$CSR_FILE"

          JWT="$(node <<'NODE'
          const crypto = require('crypto');
          const account = JSON.parse(process.env.AGC_SERVICE_ACCOUNT_JSON);
          const now = Math.floor(Date.now() / 1000);
          const b64 = (v) => Buffer.from(JSON.stringify(v)).toString('base64url');
          const input = `${b64({ kid: account.key_id, typ: 'JWT', alg: 'PS256' })}.${b64({
            iss: account.sub_account,
            aud: 'https://oauth-login.cloud.huawei.com/oauth2/v3/token',
            iat: now,
            exp: now + 3600
          })}`;
          const signature = crypto.sign('sha256', Buffer.from(input), {
            key: account.private_key,
            padding: crypto.constants.RSA_PKCS1_PSS_PADDING,
            saltLength: 32
          });
          process.stdout.write(`${input}.${signature.toString('base64url')}`);
          NODE
          )"
          echo "::add-mask::$JWT"

          NAME_SUFFIX="${SOURCE_SHA:0:7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CERT_NAME="PaperTodo-Test-$NAME_SUFFIX"
          PROFILE_NAME="PaperTodo-Test-$NAME_SUFFIX"

          CERT_REQUEST="$(jq -n --rawfile csr "$CSR_FILE" --arg certName "$CERT_NAME" '{csr: $csr, certName: $certName, certType: 2}')"
          CERT_RESPONSE="$SIGN_DIR/cert-response.json"
          CERT_STATUS="$(curl --silent --show-error --output "$CERT_RESPONSE" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $JWT" \
            --header 'Content-Type: application/json' \
            --data "$CERT_REQUEST" \
            'https://connect-api.cloud.huawei.com/api/publish/v3/cert')"
          [[ "$CERT_STATUS" == '200' && "$(jq -r '.ret.code // -1' "$CERT_RESPONSE")" == '0' ]]
          CERT_ID="$(jq -r '.certInfo.id // empty' "$CERT_RESPONSE")"
          CERT_URL="$(jq -r '.certInfo.certDownloadUrl // empty' "$CERT_RESPONSE")"
          [[ -n "$CERT_ID" && -n "$CERT_URL" ]]
          curl --fail --location --silent --show-error "$CERT_URL" --output "$CERT_FILE"
          echo "Created AGC release certificate: $CERT_NAME"

          PROFILE_REQUEST="$(jq -n --arg provisionName "$PROFILE_NAME" --arg certId "$CERT_ID" --arg appId "$AGC_APP_ID" \
            '{provisionName: $provisionName, provisionType: 2, certId: $certId, appId: $appId}')"
          PROFILE_RESPONSE="$SIGN_DIR/profile-response.json"
          PROFILE_STATUS="$(curl --silent --show-error --output "$PROFILE_RESPONSE" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $JWT" \
            --header 'Content-Type: application/json' \
            --data "$PROFILE_REQUEST" \
            'https://connect-api.cloud.huawei.com/api/publish/v3/provision')"
          [[ "$PROFILE_STATUS" == '200' && "$(jq -r '.ret.code // -1' "$PROFILE_RESPONSE")" == '0' ]]
          PROFILE_URL="$(jq -r '.provisionInfo.provisionDownloadUrl // empty' "$PROFILE_RESPONSE")"
          [[ -n "$PROFILE_URL" ]]
          curl --fail --location --silent --show-error "$PROFILE_URL" --output "$PROFILE_FILE"
          echo "Created AGC release profile: $PROFILE_NAME"

          SIGN_TOOL="$(find "$HOS_SDK_HOME" -type f \( -name 'hap-sign-tool.jar' -o -name 'hap_sign_tool.jar' \) -print | head -n 1)"
          UNSIGNED_APP="$(find . -type f -name '*-unsigned.app' -path '*/build/*' -print | head -n 1)"
          [[ -n "$SIGN_TOOL" && -n "$UNSIGNED_APP" ]]
          SIGNED_APP="package/PaperTodo-HarmonyOS-${SOURCE_SHA:0:7}-release-signed.app"

          java -jar "$SIGN_TOOL" sign-app \
            -keyAlias "$KEY_ALIAS" \
            -signAlg SHA256withECDSA \
            -mode localSign \
            -appCertFile "$CERT_FILE" \
            -profileFile "$PROFILE_FILE" \
            -inFile "$UNSIGNED_APP" \
            -keystoreFile "$KEYSTORE" \
            -outFile "$SIGNED_APP" \
            -keyPwd "$KEYSTORE_PASSWORD" \
            -keystorePwd "$KEYSTORE_PASSWORD" \
            -signCode 1

          java -jar "$SIGN_TOOL" verify-app \
            -inFile "$SIGNED_APP" \
            -outCertChain "$SIGN_DIR/verified-cert-chain.cer" \
            -outProfile "$SIGN_DIR/verified-profile.p7b"

          sha256sum "$SIGNED_APP" | tee package/SHA256SUMS
          echo "Signed APP verified: $SIGNED_APP"

      - name: Upload signed test APP
        uses: actions/upload-artifact@v4
        with:
          name: PaperTodo-HarmonyOS-window-host-refactor-signed-test
          retention-days: 1
          if-no-files-found: error
          path: |
            package/*-release-signed.app
            package/SHA256SUMS
