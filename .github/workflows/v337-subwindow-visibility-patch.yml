name: V337 Subwindow Visibility Patch
on:
  push:
    branches:
      - fix/v337-subwindow-visibility
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/_v337_subwindow_visibility_patch.py
      - name: Validate and commit
        run: |
          bash -n .github/scripts/agc-release-sign.sh
          rm .github/scripts/_v337_subwindow_visibility_patch.py .github/workflows/v337-subwindow-visibility-patch.yml
          git config user.name "PaperTodo CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: restore API23 capsule subwindow visibility"
          git push origin HEAD:fix/v337-subwindow-visibility
