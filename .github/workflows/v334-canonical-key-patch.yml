name: V334 Canonical Key Patch

on:
  push:
    branches:
      - fix/v334-canonical-key-compare

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch release public-key comparison
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          path = Path('.github/scripts/agc-release-sign.sh')
          text = path.read_text()
          start = text.index('verify_persistent_key_matches_certificate() {')
          end = text.index('create_stable_certificate() {', start)
          replacement = base64.b64decode('').decode()
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Commit patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PaperTodo CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/v334-canonical-key-patch.yml
          git add .github/scripts/agc-release-sign.sh
          bash -n .github/scripts/agc-release-sign.sh
          git diff --check
          git commit -m "ci: compare canonical AGC release public keys"
          git push origin HEAD:fix/v334-canonical-key-compare
