name: Apply HarmonyOS PC device regression fixes

on:
  push:
    branches:
      - fix/device-capsule-toolbar-taskbar

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply device-tested fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_one(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected exactly one match, got {count}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1/2. Never park a top-level capsule window outside the usable desktop.
          # Keep the native window fully in-bounds and clip/translate only its ArkUI content.
          edge_ability = 'entry/src/main/ets/edgecapsuleability/EdgeCapsuleAbility.ets'
          replace_one(edge_ability,
              '  CAPSULE_CLOSE_WIDTH,\n',
              '')
          replace_one(edge_ability,
              '''    let visibleWidthVp: number = paper.isCollapsed ? widthVp - CAPSULE_CLOSE_WIDTH : widthVp;\n    if (state.capsuleCollapseAllActive) {\n      visibleWidthVp = 0;\n    }\n    visibleWidthVp = Math.max(0, visibleWidthVp);\n    const targetX: number = area.left + area.width - Math.round(uiContext.vp2px(visibleWidthVp));\n''',
              '''    // HarmonyOS PC may clamp a floating top-level window that extends beyond\n    // the available desktop. Keep the native host fully on-screen; EdgeCapsule\n    // performs the visual hide/reveal inside this clipped window instead.\n    const targetX: number = area.left + area.width - widthPx;\n''')

          edge_page = 'entry/src/main/ets/pages/EdgeCapsule.ets'
          replace_one(edge_page,
              '''    let visibleWidthVp: number = widthVp;\n    if (state.capsuleCollapseAllActive) {\n      visibleWidthVp = 0;\n    } else if (this.hideEdgeCapsuleCloseButtonOnHover ||\n      (!this.isPointerSessionActive() && latest.isCollapsed)) {\n      visibleWidthVp = Math.max(1, widthVp - CAPSULE_CLOSE_WIDTH);\n    }\n    const targetX: number = area.left + area.width - Math.round(uiContext.vp2px(visibleWidthVp));\n''',
              '''    // The native window itself always stays flush with and fully inside the\n    // right edge. Visual retraction is an ArkUI translation below, not an\n    // out-of-bounds moveWindowTo() request that the PC window manager can clamp.\n    const targetX: number = area.left + area.width - widthPx;\n''')
          replace_one(edge_page,
              '''    let startX: number = targetX;\n    let startY: number = targetY;\n    try {\n      const rect: window.Rect = win.getWindowProperties().windowRect;\n      startX = rect.left;\n      startY = rect.top;\n    } catch (error) {\n      console.warn('read edge capsule position failed: ' + String(error));\n    }\n    if (!animate || duration <= 0 || (startX === targetX && startY === targetY)) {\n''',
              '''    let startY: number = targetY;\n    try {\n      const rect: window.Rect = win.getWindowProperties().windowRect;\n      startY = rect.top;\n    } catch (error) {\n      console.warn('read edge capsule position failed: ' + String(error));\n    }\n    if (!animate || duration <= 0 || startY === targetY) {\n''')
          replace_one(edge_page,
              '''      const x: number = Math.round(startX + (targetX - startX) * eased);\n      const y: number = Math.round(startY + (targetY - startY) * eased);\n      try {\n        await win.moveWindowTo(x, y);\n''',
              '''      const y: number = Math.round(startY + (targetY - startY) * eased);\n      try {\n        // Horizontal motion is deliberately forbidden here. Repeated native\n        // X moves fought the HarmonyOS PC window manager and produced the\n        // visible edge/inset ping-pong seen on hardware.\n        await win.moveWindowTo(targetX, y);\n''')
          replace_one(edge_page,
              '''  @Builder\n  private CapsuleContextMenu() {\n''',
              '''  private contentOffsetX(): number {\n    if (this.capsuleCollapseAllActive) {\n      const width: number = this.paper === null ? CAPSULE_MAX_WIDTH : this.paper.capsuleWidth;\n      return Math.max(CAPSULE_MIN_WIDTH, Math.min(CAPSULE_MAX_WIDTH, width));\n    }\n    if (this.hideEdgeCapsuleCloseButtonOnHover ||\n      (!this.isPointerSessionActive() && this.isCollapsed)) {\n      return CAPSULE_CLOSE_WIDTH;\n    }\n    return 0;\n  }\n\n  @Builder\n  private CapsuleContextMenu() {\n''')
          replace_one(edge_page,
              '''      .width('100%')\n      .height(30)\n      .backgroundColor(this.palette().paper)\n''',
              '''      .width('100%')\n      .height(30)\n      .translate({ x: this.contentOffsetX() })\n      .animation({\n        duration: this.enableAnimations ? (this.isPointerSessionActive() ? 130 : 170) : 0,\n        curve: Curve.EaseOut\n      })\n      .backgroundColor(this.palette().paper)\n''')
          replace_one(edge_page,
              '''    .width('100%')\n    .height('100%')\n    .opacity(this.capsuleCollapseAllActive ? 0 : 1)\n''',
              '''    .width('100%')\n    .height('100%')\n    .clip(true)\n    .opacity(this.capsuleCollapseAllActive ? 0 : 1)\n''')

          # 3/4. Text drag sources require copyOption; compact toolbar controls must
          # not use the default capsule-button content padding.
          paper_page = 'entry/src/main/ets/pages/Paper.ets'
          replace_one(paper_page,
              '''              .accessibilityText(this.text('link.to'))\n              .draggable(true)\n              .onDragStart((event: DragEvent): DragItemInfo => this.beginPaperLinkDrag(event))\n''',
              '''              .accessibilityText(this.text('link.to'))\n              .copyOption(CopyOptions.LocalDevice)\n              .draggable(true)\n              .onDragStart((event: DragEvent): DragItemInfo => this.beginPaperLinkDrag(event))\n''')
          replace_one(paper_page,
              '''        .width(28)\n        .height(30)\n        .backgroundColor(Color.Transparent)\n        .accessibilityText(this.text(this.alwaysOnTop ? 'action.unpin' : 'action.pin'))\n''',
              '''        .width(28)\n        .height(30)\n        .type(ButtonType.Normal)\n        .padding(0)\n        .backgroundColor(Color.Transparent)\n        .accessibilityText(this.text(this.alwaysOnTop ? 'action.unpin' : 'action.pin'))\n''')
          for label, width in [('MD', 38), ('＋✓', 34), ('＋✎', 34)]:
              replace_one(paper_page,
                  f'''            Button('{label}')\n              .width({width})\n              .height(30)\n              .fontSize(''',
                  f'''            Button('{label}')\n              .width({width})\n              .height(30)\n              .type(ButtonType.Normal)\n              .padding(0)\n              .fontSize(''')
          replace_one(paper_page,
              '''      Button(this.canCollapseToCapsule() ? '─' : '×')\n        .width(28)\n        .height(30)\n        .fontSize(13)\n''',
              '''      Button(this.canCollapseToCapsule() ? '─' : '×')\n        .width(28)\n        .height(30)\n        .type(ButtonType.Normal)\n        .padding(0)\n        .fontSize(13)\n''')

          # 5. Keep the singleton launcher host alive but hidden. A later taskbar/
          # launcher activation now arrives in onNewWant and opens Settings.
          entry = 'entry/src/main/ets/entryability/EntryAbility.ets'
          replace_one(entry,
              '''    // A launcher activation must never turn into a manager-style main window.\n    // When papers are reachable, status-bar failures remain available from the\n    // Settings diagnostic and the transparent launcher host terminates.\n    await this.context.terminateSelf();\n''',
              '''    // Keep this singleton as an invisible launcher target. Terminating it\n    // makes a taskbar/launcher click cold-bootstrap the app again instead of\n    // delivering onNewWant, so Settings can never be reached from that icon.\n    await this.hideLauncherHost();\n''')
          replace_one(entry,
              '''  private async handleLauncherReactivation(generation: number): Promise<void> {\n    await DesktopShell.showAll(this.context);\n''',
              '''  private async handleLauncherReactivation(generation: number): Promise<void> {\n    await DesktopShell.openSettings(this.context);\n''')
          replace_one(entry,
              '''    await this.context.terminateSelf();\n  }\n\n  private async cleanupFailedResident(): Promise<void> {\n''',
              '''    await this.hideLauncherHost();\n  }\n\n  private async hideLauncherHost(): Promise<void> {\n    this.applyHiddenHostStyle();\n    try {\n      await this.context.hideAbility();\n    } catch (error) {\n      // hideAbility is available on PC/2-in-1 only after the app has a status\n      // bar item. If the status-bar service is unavailable, keeping this host\n      // transparent/non-focusable is still preferable to terminating the\n      // singleton and losing taskbar reactivation semantics.\n      console.warn('hide launcher host failed: ' + String(error));\n    }\n  }\n\n  private async cleanupFailedResident(): Promise<void> {\n''')

          # Guard the intended invariants before committing from CI.
          assert 'area.left + area.width - widthPx' in Path(edge_ability).read_text(encoding='utf-8')
          edge_text = Path(edge_page).read_text(encoding='utf-8')
          assert '.translate({ x: this.contentOffsetX() })' in edge_text
          assert 'await win.moveWindowTo(targetX, y);' in edge_text
          paper_text = Path(paper_page).read_text(encoding='utf-8')
          assert '.copyOption(CopyOptions.LocalDevice)' in paper_text
          assert paper_text.count('.type(ButtonType.Normal)') >= 5
          entry_text = Path(entry).read_text(encoding='utf-8')
          assert 'await DesktopShell.openSettings(this.context);' in entry_text
          assert 'await this.hideLauncherHost();' in entry_text

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "PaperTodo CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-device-regression-fixes.yml
          git add entry/src/main/ets/edgecapsuleability/EdgeCapsuleAbility.ets \
                  entry/src/main/ets/pages/EdgeCapsule.ets \
                  entry/src/main/ets/pages/Paper.ets \
                  entry/src/main/ets/entryability/EntryAbility.ets
          git commit -m "fix: stabilize HarmonyOS PC desktop interactions"
          git push origin HEAD:fix/device-capsule-toolbar-taskbar
