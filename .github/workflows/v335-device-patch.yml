name: V335 Device Patch

on:
  push:
    branches:
      - fix/v335-taskbar-mask-edge

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply device regression patch
        run: python3 .github/scripts/_v335_device_patch.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/agc-release-sign.sh
          git diff --check
          git config user.name "PaperTodo CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/scripts/_v335_device_patch.py .github/workflows/v335-device-patch.yml
          git add AppScope/app.json5 CHANGELOG.md entry/src/main/ets/pages/Index.ets entry/src/main/ets/pages/MasterCapsule.ets entry/src/main/ets/mastercapsuleability/MasterCapsuleAbility.ets entry/src/main/ets/common/CapsuleWindowMask.ets entry/src/main/syscap.json
          git commit -m "fix: use live settings mission and native capsule mask"
          git push origin HEAD:fix/v335-taskbar-mask-edge
