name: HarmonyOS Formal Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

# AGC release certificates and profiles are account-level resources. Serialize
# formal packages so rolling slot maintenance and certificate creation cannot race.
concurrency:
  group: harmonyos-formal-package
  cancel-in-progress: false

jobs:
  package:
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[formal-package]'))
    name: Validate, build, sign, and verify release APP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Validate release scripts
        shell: bash
        run: |
          bash -n .github/scripts/agc-release-sign.sh
          bash -n .github/scripts/agc-release-slot-maintenance.sh
          bash -n .github/scripts/agc-release-inventory.sh

      - name: Require protected release signing inputs
        shell: bash
        env:
          AGC_SERVICE_ACCOUNT_JSON: ${{ secrets.AGC_SERVICE_ACCOUNT_JSON }}
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
        run: bash .github/scripts/agc-release-sign.sh check

      - name: Cleanup stale PaperTodo test signing resources
        shell: bash
        env:
          AGC_SERVICE_ACCOUNT_JSON: ${{ secrets.AGC_SERVICE_ACCOUNT_JSON }}
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
        run: bash .github/scripts/agc-release-sign.sh cleanup-stale

      - name: Ensure a rolling AGC release certificate slot
        shell: bash
        env:
          AGC_SERVICE_ACCOUNT_JSON: ${{ secrets.AGC_SERVICE_ACCOUNT_JSON }}
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
        run: bash .github/scripts/agc-release-slot-maintenance.sh

      - name: Cache HarmonyOS Command Line Tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: command-line-tools
          key: ${{ runner.os }}-harmonyos-cli-6.1.0.816

      - name: Download HarmonyOS Command Line Tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 \
            --output tools.zip \
            https://github.com/Okysu/harmony-auto-build/releases/download/commandline-tools-linux-x64-6.1.0.816/commandline-tools-linux-x64-6.1.0.816.zip
          echo "4b21e8a4ce19fc7eb381425a570e936c80067b8a0bef9cdcfe8a49e4764038e2  tools.zip" | sha256sum --check -
          unzip -q tools.zip
          rm tools.zip

      - name: Setup HarmonyOS build environment
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_DIR="$GITHUB_WORKSPACE/command-line-tools"
          echo "hwsdk.dir=$TOOLS_DIR/sdk" > local.properties
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "OHPM_HOME=$TOOLS_DIR/ohpm" >> "$GITHUB_ENV"
          echo "HOS_SDK_HOME=$TOOLS_DIR/sdk" >> "$GITHUB_ENV"
          chmod -R +x "$TOOLS_DIR/bin"

      - name: Resolve formal package metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Manual formal packages must be built from main.' >&2
            exit 1
          fi
          SOURCE_SHA="$GITHUB_SHA"
          APP_VERSION="$(node -e "const fs=require('fs');const app=JSON.parse(fs.readFileSync('AppScope/app.json5','utf8'));process.stdout.write(app.app.versionName)")"
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Formal package version must be stable semver, got: $APP_VERSION" >&2
            exit 1
          fi
          VERSION="v${APP_VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$GITHUB_REF_NAME"
            if [[ "$VERSION" != "v${APP_VERSION}" ]]; then
              echo "Tag $VERSION does not match AppScope version v${APP_VERSION}." >&2
              exit 1
            fi
          fi

          VERSION="$(printf '%s' "$VERSION" | tr -cs 'A-Za-z0-9._-' '-')"
          PACKAGE_BASENAME="PaperTodo-HarmonyOS-${VERSION}-${SOURCE_SHA:0:7}-release-signed"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_BASENAME=$PACKAGE_BASENAME" >> "$GITHUB_ENV"
          echo "Formal package: $PACKAGE_BASENAME"

      - name: Install dependencies
        run: ohpm install

      - name: Compile Hypium suite and attempt Local Test
        shell: bash
        timeout-minutes: 2
        run: |
          set +e
          timeout --signal=TERM --kill-after=5s 45s \
            hvigorw test -p module=entry -p coverage=false --no-daemon 2>&1 | tee local-test.log
          status=${PIPESTATUS[0]}
          set -e

          result='entry/.test/default/intermediates/test/coverage_data/test_result.txt'
          if [[ -s "$result" ]]; then
            echo '--- HarmonyOS Local Test result ---'
            cat "$result"
          fi

          if [[ "$status" == '0' ]]; then
            echo 'HarmonyOS Local Test executed successfully.'
            exit 0
          fi

          if [[ "$status" == '124' || "$status" == '137' ]]; then
            if grep -Fq 'Finished :entry:default@UnitTestArkTS' local-test.log && \
               ! grep -Eq 'ArkTS:ERROR|ERROR:|BUILD FAILED|FAILED:|hvigor.*ERROR' local-test.log; then
              echo 'Linux HarmonyOS previewer did not execute assertions; all Hypium test sources compiled successfully.'
              echo 'Assertion execution remains a Windows/macOS/device validation requirement.'
              exit 0
            fi
          fi

          echo "Hypium validation failed with status $status." >&2
          exit "$status"

      - name: Assemble release APP
        run: hvigorw assembleApp --mode project -p product=default -p buildMode=release -p enableSignTask=false --no-daemon

      - name: Create, sign, and verify AGC release APP
        shell: bash
        env:
          AGC_SERVICE_ACCOUNT_JSON: ${{ secrets.AGC_SERVICE_ACCOUNT_JSON }}
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
        run: bash .github/scripts/agc-release-sign.sh sign

      - name: Report safe AGC signing failure details
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          SIGN_DIR="${RUNNER_TEMP}/papertodo-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for response in cert-response.json profile-response.json; do
            file="$SIGN_DIR/$response"
            if [[ -s "$file" ]]; then
              echo "--- $response ---"
              jq '{ret: .ret}' "$file" || true
            fi
          done

      - name: Upload verified signed release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_BASENAME }}
          if-no-files-found: error
          retention-days: 30
          path: |
            package/${{ env.PACKAGE_BASENAME }}.zip
            package/payload/${{ env.PACKAGE_BASENAME }}.app
            package/payload/SHA256SUMS
            package/payload/BUILD_INFO.txt
