name: HarmonyOS Package

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build mode
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: harmonyos-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ONE_SHOT_TEST_SIGNING: 'true'

jobs:
  package:
    name: Package APP and HAP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Verify AGC developer Service Account
        shell: bash
        env:
          AGC_SERVICE_ACCOUNT_JSON: ${{ secrets.AGC_SERVICE_ACCOUNT_JSON }}
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${AGC_SERVICE_ACCOUNT_JSON:-}" || -z "${AGC_APP_ID:-}" ]]; then
            echo 'AGC credentials are unavailable; release build will continue unsigned.'
            echo 'AGC_PROVISIONING_AVAILABLE=false' >> "$GITHUB_ENV"
            exit 0
          fi

          JWT="$(node <<'NODE'
          const crypto = require('crypto');
          const account = JSON.parse(process.env.AGC_SERVICE_ACCOUNT_JSON);
          for (const key of ['key_id', 'private_key', 'sub_account']) {
            if (!account[key]) throw new Error(`AGC Service Account JSON is missing ${key}`);
          }
          const now = Math.floor(Date.now() / 1000);
          const b64 = (value) => Buffer.from(JSON.stringify(value)).toString('base64url');
          const input = `${b64({ kid: account.key_id, typ: 'JWT', alg: 'PS256' })}.${b64({
            iss: account.sub_account,
            aud: 'https://oauth-login.cloud.huawei.com/oauth2/v3/token',
            iat: now,
            exp: now + 3600
          })}`;
          const signature = crypto.sign('sha256', Buffer.from(input), {
            key: account.private_key,
            padding: crypto.constants.RSA_PKCS1_PSS_PADDING,
            saltLength: 32
          });
          process.stdout.write(`${input}.${signature.toString('base64url')}`);
          NODE
          )"
          echo "::add-mask::$JWT"

          BODY="$(mktemp)"
          STATUS="$(curl --silent --show-error \
            --output "$BODY" \
            --write-out '%{http_code}' \
            --request GET \
            --header "Authorization: Bearer $JWT" \
            --header "appId: $AGC_APP_ID" \
            --header 'Content-Type: application/json' \
            'https://connect-api.cloud.huawei.com/api/publish/v3/provision/list?fromRecCount=1&maxReqCount=10')"

          if [[ "$STATUS" != '200' ]]; then
            echo "AGC Provisioning probe returned HTTP $STATUS; release build will continue unsigned." >&2
            rm -f "$BODY"
            echo 'AGC_PROVISIONING_AVAILABLE=false' >> "$GITHUB_ENV"
            exit 0
          fi
          RET_CODE="$(jq -r '.ret.code // -1' "$BODY")"
          TOTAL_COUNT="$(jq -r '.totalCount // 0' "$BODY")"
          rm -f "$BODY"
          if [[ "$RET_CODE" != '0' ]]; then
            echo "AGC Provisioning probe returned ret.code=$RET_CODE; release build will continue unsigned." >&2
            echo 'AGC_PROVISIONING_AVAILABLE=false' >> "$GITHUB_ENV"
            exit 0
          fi
          echo "AGC developer Service Account verified; visible profiles: $TOTAL_COUNT"
          echo 'AGC_PROVISIONING_AVAILABLE=true' >> "$GITHUB_ENV"

      - name: Cache HarmonyOS Command Line Tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: command-line-tools
          key: ${{ runner.os }}-harmonyos-cli-6.1.0.816

      - name: Download HarmonyOS Command Line Tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 \
            --output tools.zip \
            https://github.com/Okysu/harmony-auto-build/releases/download/commandline-tools-linux-x64-6.1.0.816/commandline-tools-linux-x64-6.1.0.816.zip
          echo "4b21e8a4ce19fc7eb381425a570e936c80067b8a0bef9cdcfe8a49e4764038e2  tools.zip" | sha256sum --check -
          unzip -q tools.zip
          rm tools.zip

      - name: Setup HarmonyOS build environment
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_DIR="$GITHUB_WORKSPACE/command-line-tools"
          echo "hwsdk.dir=$TOOLS_DIR/sdk" > local.properties
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "OHPM_HOME=$TOOLS_DIR/ohpm" >> "$GITHUB_ENV"
          echo "HOS_SDK_HOME=$TOOLS_DIR/sdk" >> "$GITHUB_ENV"
          chmod -R +x "$TOOLS_DIR/bin"

      - name: Resolve package metadata
        shell: bash
        run: |
          set -euo pipefail
          BUILD_MODE="release"
          SOURCE_SHA="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            SOURCE_SHA="${{ github.event.pull_request.head.sha }}"
          fi
          VERSION="sha-${SOURCE_SHA:0:7}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            BUILD_MODE="${{ inputs.build_mode }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            BUILD_MODE="release"
            VERSION="$GITHUB_REF_NAME"
          fi
          VERSION="$(printf '%s' "$VERSION" | tr -cs 'A-Za-z0-9._-' '-')"
          PACKAGE_BASENAME="PaperTodo-HarmonyOS-${VERSION}-${BUILD_MODE}-unsigned"
          SIGNED_PACKAGE_BASENAME="PaperTodo-HarmonyOS-${VERSION}-${BUILD_MODE}-signed-test"
          echo "BUILD_MODE=$BUILD_MODE" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "PACKAGE_BASENAME=$PACKAGE_BASENAME" >> "$GITHUB_ENV"
          echo "SIGNED_PACKAGE_BASENAME=$SIGNED_PACKAGE_BASENAME" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$PACKAGE_BASENAME" >> "$GITHUB_ENV"
          echo "Build mode: $BUILD_MODE"
          echo "Package: $PACKAGE_BASENAME"

      - name: Install dependencies
        run: ohpm install

      - name: Assemble HarmonyOS APP
        run: hvigorw assembleApp --mode project -p product=default -p buildMode=${BUILD_MODE} -p enableSignTask=false --no-daemon

      - name: Collect package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/payload
          mapfile -t APPS < <(find . -type f -name '*.app' -path '*/build/*' -print | sort)
          mapfile -t HAPS < <(find . -type f -name '*-unsigned.hap' -path '*/build/*' -print | sort)
          if [[ ${#APPS[@]} -eq 0 ]]; then
            echo 'assembleApp succeeded, but no .app package was found.' >&2
            exit 1
          fi
          OUTPUTS=("${APPS[@]}" "${HAPS[@]}")
          printf 'Collected outputs:\n'
          printf '  %s\n' "${OUTPUTS[@]}"
          for file in "${OUTPUTS[@]}"; do cp "$file" package/payload/; done

      - name: Create one-shot AGC signed test APP
        if: env.ONE_SHOT_TEST_SIGNING == 'true' && env.AGC_PROVISIONING_AVAILABLE == 'true' && env.BUILD_MODE == 'release'
        shell: bash
        env:
          AGC_SERVICE_ACCOUNT_JSON: ${{ secrets.AGC_SERVICE_ACCOUNT_JSON }}
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
        run: |
          set -euo pipefail
          SIGN_DIR="$RUNNER_TEMP/papertodo-signing"
          mkdir -p "$SIGN_DIR"
          KEY_ALIAS='papertodo_test_release'
          KEYSTORE_PASSWORD="Pt-$(openssl rand -hex 16)-9A"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          KEYSTORE="$SIGN_DIR/papertodo-test.p12"
          CSR_FILE="$SIGN_DIR/papertodo-test.csr"
          CERT_FILE="$SIGN_DIR/papertodo-test.cer"
          PROFILE_FILE="$SIGN_DIR/papertodo-test.p7b"

          keytool -genkeypair \
            -alias "$KEY_ALIAS" \
            -keyalg EC \
            -groupname secp256r1 \
            -sigalg SHA256withECDSA \
            -dname "C=CN,O=PaperTodo,OU=GitHub CI,CN=$KEY_ALIAS" \
            -keystore "$KEYSTORE" \
            -storetype pkcs12 \
            -validity 9125 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -noprompt
          keytool -certreq \
            -alias "$KEY_ALIAS" \
            -sigalg SHA256withECDSA \
            -keystore "$KEYSTORE" \
            -storetype pkcs12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -file "$CSR_FILE"

          JWT="$(node <<'NODE'
          const crypto = require('crypto');
          const account = JSON.parse(process.env.AGC_SERVICE_ACCOUNT_JSON);
          const now = Math.floor(Date.now() / 1000);
          const b64 = (v) => Buffer.from(JSON.stringify(v)).toString('base64url');
          const input = `${b64({ kid: account.key_id, typ: 'JWT', alg: 'PS256' })}.${b64({
            iss: account.sub_account,
            aud: 'https://oauth-login.cloud.huawei.com/oauth2/v3/token',
            iat: now,
            exp: now + 3600
          })}`;
          const signature = crypto.sign('sha256', Buffer.from(input), {
            key: account.private_key,
            padding: crypto.constants.RSA_PKCS1_PSS_PADDING,
            saltLength: 32
          });
          process.stdout.write(`${input}.${signature.toString('base64url')}`);
          NODE
          )"
          echo "::add-mask::$JWT"

          NAME_SUFFIX="${SOURCE_SHA:0:7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CERT_NAME="PaperTodo-Test-$NAME_SUFFIX"
          PROFILE_NAME="PaperTodo-Test-$NAME_SUFFIX"
          CERT_REQUEST="$(jq -n --rawfile csr "$CSR_FILE" --arg certName "$CERT_NAME" '{csr: $csr, certName: $certName, certType: 2}')"
          CERT_RESPONSE_FILE="$SIGN_DIR/cert-response.json"
          CERT_STATUS="$(curl --silent --show-error \
            --output "$CERT_RESPONSE_FILE" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $JWT" \
            --header 'Content-Type: application/json' \
            --data "$CERT_REQUEST" \
            'https://connect-api.cloud.huawei.com/api/publish/v3/cert')"
          if [[ "$CERT_STATUS" != '200' || "$(jq -r '.ret.code // -1' "$CERT_RESPONSE_FILE")" != '0' ]]; then
            echo "Release certificate request failed with HTTP $CERT_STATUS." >&2
            jq '{ret: (.ret // null), code: (.code // null), message: (.message // .msg // null)}' "$CERT_RESPONSE_FILE" >&2 || true
            exit 1
          fi
          CERT_ID="$(jq -r '.certInfo.id // empty' "$CERT_RESPONSE_FILE")"
          CERT_URL="$(jq -r '.certInfo.certDownloadUrl // empty' "$CERT_RESPONSE_FILE")"
          [[ -n "$CERT_ID" && -n "$CERT_URL" ]]
          curl --fail --location --silent --show-error "$CERT_URL" --output "$CERT_FILE"
          echo "Created AGC release certificate: $CERT_NAME"

          PROFILE_REQUEST="$(jq -n \
            --arg provisionName "$PROFILE_NAME" \
            --arg certId "$CERT_ID" \
            --arg appId "$AGC_APP_ID" \
            '{provisionName: $provisionName, provisionType: 2, certId: $certId, appId: $appId}')"
          PROFILE_RESPONSE_FILE="$SIGN_DIR/profile-response.json"
          PROFILE_STATUS="$(curl --silent --show-error \
            --output "$PROFILE_RESPONSE_FILE" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $JWT" \
            --header 'Content-Type: application/json' \
            --data "$PROFILE_REQUEST" \
            'https://connect-api.cloud.huawei.com/api/publish/v3/provision')"
          if [[ "$PROFILE_STATUS" != '200' || "$(jq -r '.ret.code // -1' "$PROFILE_RESPONSE_FILE")" != '0' ]]; then
            echo "Release profile request failed with HTTP $PROFILE_STATUS." >&2
            jq '{ret: (.ret // null), code: (.code // null), message: (.message // .msg // null)}' "$PROFILE_RESPONSE_FILE" >&2 || true
            exit 1
          fi
          PROFILE_URL="$(jq -r '.provisionInfo.provisionDownloadUrl // empty' "$PROFILE_RESPONSE_FILE")"
          [[ -n "$PROFILE_URL" ]]
          curl --fail --location --silent --show-error "$PROFILE_URL" --output "$PROFILE_FILE"
          echo "Created AGC release profile: $PROFILE_NAME"

          SIGN_TOOL="$(find "$HOS_SDK_HOME" -type f \( -name 'hap-sign-tool.jar' -o -name 'hap_sign_tool.jar' \) -print | head -n 1)"
          [[ -n "$SIGN_TOOL" ]]
          UNSIGNED_APP="$(find package/payload -maxdepth 1 -type f -name '*-unsigned.app' -print | head -n 1)"
          [[ -n "$UNSIGNED_APP" ]]
          SIGNED_APP="package/payload/PaperTodo-HarmonyOS-${SOURCE_SHA:0:7}-release-signed.app"
          java -jar "$SIGN_TOOL" sign-app \
            -keyAlias "$KEY_ALIAS" \
            -signAlg SHA256withECDSA \
            -mode localSign \
            -appCertFile "$CERT_FILE" \
            -profileFile "$PROFILE_FILE" \
            -inFile "$UNSIGNED_APP" \
            -keystoreFile "$KEYSTORE" \
            -outFile "$SIGNED_APP" \
            -keyPwd "$KEYSTORE_PASSWORD" \
            -keystorePwd "$KEYSTORE_PASSWORD" \
            -signCode 1
          java -jar "$SIGN_TOOL" verify-app \
            -inFile "$SIGNED_APP" \
            -outCertChain "$SIGN_DIR/verified-cert-chain.cer" \
            -outProfile "$SIGN_DIR/verified-profile.p7b"
          echo "Signed APP verified: $SIGNED_APP"
          echo "ARTIFACT_NAME=$SIGNED_PACKAGE_BASENAME" >> "$GITHUB_ENV"

      - name: Finalize package archives
        shell: bash
        run: |
          set -euo pipefail
          (
            cd package/payload
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
            zip -9 "../${PACKAGE_BASENAME}.zip" ./*
            if compgen -G '*-signed.app' > /dev/null; then
              zip -9 "../${SIGNED_PACKAGE_BASENAME}.zip" ./*
            fi
          )
          ls -lah package package/payload

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 1
          path: |
            package/*.zip
            package/payload/*.app
            package/payload/*-unsigned.hap
            package/payload/SHA256SUMS
