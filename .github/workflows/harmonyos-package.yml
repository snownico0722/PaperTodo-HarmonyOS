name: HarmonyOS Package

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build mode
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: harmonyos-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package APP and HAP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Verify AGC Service Account
        shell: bash
        env:
          AGC_SERVICE_ACCOUNT_JSON: ${{ secrets.AGC_SERVICE_ACCOUNT_JSON }}
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${AGC_SERVICE_ACCOUNT_JSON:-}" || -z "${AGC_APP_ID:-}" ]]; then
            echo 'AGC Service Account credentials are unavailable; unsigned release build will continue.'
            echo 'AGC_PROVISIONING_AVAILABLE=false' >> "$GITHUB_ENV"
            exit 0
          fi

          JWT="$(node <<'NODE'
          const crypto = require('crypto');

          function base64url(value) {
            return Buffer.from(JSON.stringify(value)).toString('base64url');
          }

          const raw = process.env.AGC_SERVICE_ACCOUNT_JSON;
          let account;
          try {
            account = JSON.parse(raw);
          } catch (error) {
            console.error('AGC_SERVICE_ACCOUNT_JSON is not valid JSON.');
            process.exit(2);
          }

          for (const key of ['key_id', 'private_key', 'sub_account', 'token_uri']) {
            if (!account[key]) {
              console.error(`AGC Service Account JSON is missing ${key}.`);
              process.exit(2);
            }
          }

          const now = Math.floor(Date.now() / 1000);
          const header = { kid: account.key_id, typ: 'JWT', alg: 'PS256' };
          const payload = {
            iss: account.sub_account,
            aud: account.token_uri,
            iat: now,
            exp: now + 3600
          };
          const signingInput = `${base64url(header)}.${base64url(payload)}`;
          const signature = crypto.sign('sha256', Buffer.from(signingInput), {
            key: account.private_key,
            padding: crypto.constants.RSA_PKCS1_PSS_PADDING,
            saltLength: 32
          });
          process.stdout.write(`${signingInput}.${signature.toString('base64url')}`);
          NODE
          )" || {
            echo 'Failed to generate AGC Service Account JWT; unsigned release build will continue.' >&2
            echo 'AGC_PROVISIONING_AVAILABLE=false' >> "$GITHUB_ENV"
            exit 0
          }

          echo "::add-mask::$JWT"

          # First verify that the Service Account JWT itself is accepted by Connect API.
          PROJECT_BODY="$(mktemp)"
          PROJECT_STATUS="$(curl --silent --show-error \
            --output "$PROJECT_BODY" \
            --write-out '%{http_code}' \
            --request GET \
            --header "Authorization: Bearer $JWT" \
            --header 'Content-Type: application/json' \
            'https://connect-api.cloud.huawei.com/api/project-service/v1/projects')"

          if [[ "$PROJECT_STATUS" != '200' ]]; then
            echo "AGC Service Account JWT was rejected by Project Management API with HTTP $PROJECT_STATUS." >&2
            rm -f "$PROJECT_BODY"
            echo 'AGC_PROVISIONING_AVAILABLE=false' >> "$GITHUB_ENV"
            exit 0
          fi
          rm -f "$PROJECT_BODY"
          echo 'AGC Service Account JWT accepted by Project Management API.'

          # Then verify the app-scoped certificate/Profile permission separately.
          PROFILE_BODY="$(mktemp)"
          PROFILE_STATUS="$(curl --silent --show-error \
            --output "$PROFILE_BODY" \
            --write-out '%{http_code}' \
            --request GET \
            --header "Authorization: Bearer $JWT" \
            --header "appId: $AGC_APP_ID" \
            --header 'Content-Type: application/json' \
            'https://connect-api.cloud.huawei.com/api/publish/v3/provision/list?fromRecCount=1&maxReqCount=10')"

          PROFILE_RESPONSE="$(cat "$PROFILE_BODY")"
          rm -f "$PROFILE_BODY"

          if [[ "$PROFILE_STATUS" != '200' ]]; then
            echo "AGC Service Account JWT is valid, but Provisioning API returned HTTP $PROFILE_STATUS." >&2
            if jq -e . >/dev/null 2>&1 <<<"$PROFILE_RESPONSE"; then
              jq '{ret: (.ret // null), code: (.code // null), message: (.message // .msg // null)}' \
                <<<"$PROFILE_RESPONSE" >&2
            fi
            echo 'AGC_PROVISIONING_AVAILABLE=false' >> "$GITHUB_ENV"
            exit 0
          fi

          RET_CODE="$(jq -r '.ret.code // -1' <<<"$PROFILE_RESPONSE")"
          if [[ "$RET_CODE" != '0' ]]; then
            jq '{ret: .ret}' <<<"$PROFILE_RESPONSE" >&2
            echo 'AGC_PROVISIONING_AVAILABLE=false' >> "$GITHUB_ENV"
            exit 0
          fi

          TOTAL_COUNT="$(jq -r '.totalCount // 0' <<<"$PROFILE_RESPONSE")"
          echo "AGC Provisioning API authentication succeeded; visible profiles: $TOTAL_COUNT"
          echo 'AGC_PROVISIONING_AVAILABLE=true' >> "$GITHUB_ENV"

      - name: Cache HarmonyOS Command Line Tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: command-line-tools
          key: ${{ runner.os }}-harmonyos-cli-6.1.0.816

      - name: Download HarmonyOS Command Line Tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 \
            --output tools.zip \
            https://github.com/Okysu/harmony-auto-build/releases/download/commandline-tools-linux-x64-6.1.0.816/commandline-tools-linux-x64-6.1.0.816.zip
          echo "4b21e8a4ce19fc7eb381425a570e936c80067b8a0bef9cdcfe8a49e4764038e2  tools.zip" | sha256sum --check -
          unzip -q tools.zip
          rm tools.zip

      - name: Setup HarmonyOS build environment
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_DIR="$GITHUB_WORKSPACE/command-line-tools"
          echo "hwsdk.dir=$TOOLS_DIR/sdk" > local.properties
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "OHPM_HOME=$TOOLS_DIR/ohpm" >> "$GITHUB_ENV"
          echo "HOS_SDK_HOME=$TOOLS_DIR/sdk" >> "$GITHUB_ENV"
          chmod -R +x "$TOOLS_DIR/bin"

      - name: Resolve package metadata
        shell: bash
        run: |
          set -euo pipefail

          BUILD_MODE="release"
          SOURCE_SHA="$GITHUB_SHA"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            SOURCE_SHA="${{ github.event.pull_request.head.sha }}"
          fi

          VERSION="sha-${SOURCE_SHA:0:7}"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            BUILD_MODE="${{ inputs.build_mode }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            BUILD_MODE="release"
            VERSION="$GITHUB_REF_NAME"
          fi

          VERSION="$(printf '%s' "$VERSION" | tr -cs 'A-Za-z0-9._-' '-')"
          PACKAGE_BASENAME="PaperTodo-HarmonyOS-${VERSION}-${BUILD_MODE}-unsigned"

          echo "BUILD_MODE=$BUILD_MODE" >> "$GITHUB_ENV"
          echo "PACKAGE_BASENAME=$PACKAGE_BASENAME" >> "$GITHUB_ENV"
          echo "Build mode: $BUILD_MODE"
          echo "Package: $PACKAGE_BASENAME"

      - name: Install dependencies
        run: ohpm install

      - name: Assemble HarmonyOS APP
        run: hvigorw assembleApp --mode project -p product=default -p buildMode=${BUILD_MODE} -p enableSignTask=false --no-daemon

      - name: Collect package outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/payload

          mapfile -t APPS < <(
            find . -type f -name '*.app' -path '*/build/*' -print | sort
          )
          mapfile -t HAPS < <(
            find . -type f -name '*-unsigned.hap' -path '*/build/*' -print | sort
          )

          if [[ ${#APPS[@]} -eq 0 ]]; then
            echo 'assembleApp succeeded, but no .app package was found.' >&2
            echo 'Build outputs:' >&2
            find . -type f -path '*/build/*' \
              \( -name '*.app' -o -name '*.hap' \) \
              -print >&2
            exit 1
          fi

          OUTPUTS=("${APPS[@]}" "${HAPS[@]}")
          printf 'Collected outputs:\n'
          printf '  %s\n' "${OUTPUTS[@]}"

          for file in "${OUTPUTS[@]}"; do
            cp "$file" package/payload/
          done

          (
            cd package/payload
            sha256sum ./* > SHA256SUMS
            zip -9 "../${PACKAGE_BASENAME}.zip" ./*
          )

          ls -lah package package/payload

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_BASENAME }}
          if-no-files-found: error
          retention-days: 30
          path: |
            package/${{ env.PACKAGE_BASENAME }}.zip
            package/payload/*.app
            package/payload/*-unsigned.hap
            package/payload/SHA256SUMS
