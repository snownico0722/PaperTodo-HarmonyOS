name: HarmonyOS Formal Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

# AGC release certificates and profiles are account-level resources. Serialize
# formal packages so concurrent runs cannot consume or replace the same quota.
concurrency:
  group: harmonyos-formal-package
  cancel-in-progress: false

jobs:
  package:
    name: Build, sign, and verify release APP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Require AGC release signing credentials
        shell: bash
        env:
          AGC_SERVICE_ACCOUNT_JSON: ${{ secrets.AGC_SERVICE_ACCOUNT_JSON }}
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
        run: bash .github/scripts/agc-release-sign.sh check

      - name: Cleanup stale PaperTodo test signing resources
        shell: bash
        env:
          AGC_SERVICE_ACCOUNT_JSON: ${{ secrets.AGC_SERVICE_ACCOUNT_JSON }}
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
        run: bash .github/scripts/agc-release-sign.sh cleanup-stale

      - name: Cache HarmonyOS Command Line Tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: command-line-tools
          key: ${{ runner.os }}-harmonyos-cli-6.1.0.816

      - name: Download HarmonyOS Command Line Tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 \
            --output tools.zip \
            https://github.com/Okysu/harmony-auto-build/releases/download/commandline-tools-linux-x64-6.1.0.816/commandline-tools-linux-x64-6.1.0.816.zip
          echo "4b21e8a4ce19fc7eb381425a570e936c80067b8a0bef9cdcfe8a49e4764038e2  tools.zip" | sha256sum --check -
          unzip -q tools.zip
          rm tools.zip

      - name: Setup HarmonyOS build environment
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_DIR="$GITHUB_WORKSPACE/command-line-tools"
          echo "hwsdk.dir=$TOOLS_DIR/sdk" > local.properties
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "OHPM_HOME=$TOOLS_DIR/ohpm" >> "$GITHUB_ENV"
          echo "HOS_SDK_HOME=$TOOLS_DIR/sdk" >> "$GITHUB_ENV"
          chmod -R +x "$TOOLS_DIR/bin"

      - name: Resolve formal package metadata
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            SOURCE_SHA="${{ github.event.pull_request.head.sha }}"
          fi

          APP_VERSION="$(node -e "const fs=require('fs');const app=JSON.parse(fs.readFileSync('AppScope/app.json5','utf8'));process.stdout.write(app.app.versionName)")"
          VERSION="v${APP_VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$GITHUB_REF_NAME"
            if [[ "$VERSION" != "v${APP_VERSION}" ]]; then
              echo "Tag $VERSION does not match AppScope version v${APP_VERSION}." >&2
              exit 1
            fi
          fi

          VERSION="$(printf '%s' "$VERSION" | tr -cs 'A-Za-z0-9._-' '-')"
          PACKAGE_BASENAME="PaperTodo-HarmonyOS-${VERSION}-${SOURCE_SHA:0:7}-release-signed"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_BASENAME=$PACKAGE_BASENAME" >> "$GITHUB_ENV"
          echo "Formal package: $PACKAGE_BASENAME"

      - name: Install dependencies
        run: ohpm install

      - name: Assemble release APP
        run: hvigorw assembleApp --mode project -p product=default -p buildMode=release -p enableSignTask=false --no-daemon

      - name: Create, sign, and verify AGC release APP
        shell: bash
        env:
          AGC_SERVICE_ACCOUNT_JSON: ${{ secrets.AGC_SERVICE_ACCOUNT_JSON }}
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
        run: bash .github/scripts/agc-release-sign.sh sign

      - name: Upload verified signed release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_BASENAME }}
          if-no-files-found: error
          retention-days: 30
          path: |
            package/${{ env.PACKAGE_BASENAME }}.zip
            package/payload/${{ env.PACKAGE_BASENAME }}.app
            package/payload/SHA256SUMS
            package/payload/BUILD_INFO.txt
