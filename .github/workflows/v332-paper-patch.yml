name: V332 Paper Patch

on:
  push:
    branches:
      - fix/v332-capsule-host

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Paper association drag source
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import base64;exec(base64.b64decode(''))"
          git diff --check -- entry/src/main/ets/pages/Paper.ets
      - name: Commit source patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PaperTodo CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/v332-paper-patch.yml
          git add entry/src/main/ets/pages/Paper.ets
          git commit -m "fix: use custom UDMF paper drag source"
          git push origin HEAD:fix/v332-capsule-host
