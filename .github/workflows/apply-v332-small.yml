name: Apply v3.3.2 small changes

on:
  push:
    branches:
      - fix/v332-capsule-host

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Paper drag source and version
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('entry/src/main/ets/pages/Paper.ets')
          text = path.read_text()
          old = """            Text(this.isPaperLinked() ? '⦿' : '⌖')
              .width(26)
              .height(30)
              .fontSize(13)
              .fontColor(this.textColor())
              .textAlign(TextAlign.Center)
              .accessibilityText(this.text('link.to'))
              .copyOption(CopyOptions.LocalDevice)
              .draggable(true)
              .onDragStart((event: DragEvent): DragItemInfo => this.beginPaperLinkDrag(event))
"""
          new = """            Stack({ alignContent: Alignment.Center }) {
              Text(this.isPaperLinked() ? '⦿' : '⌖')
                .fontSize(13)
                .fontColor(this.textColor())
                .textAlign(TextAlign.Center)
            }
              .id('paper_link_drag_handle')
              .width(26)
              .height(30)
              .accessibilityText(this.text('link.to'))
              .draggable(true)
              .dragPreview('paper_link_drag_handle')
              .onDragStart((event: DragEvent): DragItemInfo => this.beginPaperLinkDrag(event))
"""
          if old not in text:
              raise SystemExit('paper link drag block not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('AppScope/app.json5')
          text = path.read_text()
          text = text.replace('"versionCode": 3030100', '"versionCode": 3030200')
          text = text.replace('"versionName": "3.3.1"', '"versionName": "3.3.2"')
          path.write_text(text)

          path = Path('CHANGELOG.md')
          text = path.read_text()
          section = """## 3.3.2 — 2026-09-02

第二轮 HarmonyOS PC 真机回归修复。3.3.1 对窗口纠偏和 Text 拖拽的判断不成立，本版改为结构修复：

- 主胶囊与全部普通侧边胶囊合并进单一顶层胶囊宿主，不再为每个普通胶囊创建独立 specified UIAbility / mission。
- 胶囊宿主右边缘固定；主胶囊收起/展开只动画内部 ArkUI 行，不改变宿主窗口 X 或宽度。
- 窗口几何改用 resizeAsync / moveWindowToAsync 并缓存最终矩形，避免异步 resize/move 相互覆盖。
- 纸片关联拖动柄改为自定义 Stack 拖拽源，使用 draggable + dragPreview + UDMF onDragStart，不再复用 Text 原生文本拖拽。
- 隐藏 EntryAbility 在启动完成后同时处理 onNewWant 与 onForeground，任务栏/mission 前台激活统一打开设置。
- 版本更新为 3.3.2（versionCode 3030200）。

"""
          if '## 3.3.2 — 2026-09-02' not in text:
              text = '# Changelog\n\n' + section + text.removeprefix('# Changelog\n\n')
          path.write_text(text)
          PY
      - name: Remove temporary workflows and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-v332-runtime-fixes.yml
          git rm .github/workflows/apply-v332-small.yml
          git config user.name "PaperTodo CI"
          git config user.email "actions@users.noreply.github.com"
          git add entry AppScope CHANGELOG.md .github/workflows
          git commit -m "fix: finish v3.3.2 device regressions"
          git push origin HEAD:fix/v332-capsule-host
