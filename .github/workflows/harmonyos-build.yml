name: HarmonyOS Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: harmonyos-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate tests and build unsigned HAP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Validate release scripts
        shell: bash
        run: |
          bash -n .github/scripts/agc-release-sign.sh
          bash -n .github/scripts/agc-release-inventory.sh

      - name: Cache HarmonyOS Command Line Tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: command-line-tools
          key: ${{ runner.os }}-harmonyos-cli-6.1.0.816

      - name: Download HarmonyOS Command Line Tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 \
            --output tools.zip \
            https://github.com/Okysu/harmony-auto-build/releases/download/commandline-tools-linux-x64-6.1.0.816/commandline-tools-linux-x64-6.1.0.816.zip
          echo "4b21e8a4ce19fc7eb381425a570e936c80067b8a0bef9cdcfe8a49e4764038e2  tools.zip" | sha256sum --check -
          unzip -q tools.zip
          rm tools.zip

      - name: Setup HarmonyOS build environment
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_DIR="$GITHUB_WORKSPACE/command-line-tools"
          echo "hwsdk.dir=$TOOLS_DIR/sdk" > local.properties
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "OHPM_HOME=$TOOLS_DIR/ohpm" >> "$GITHUB_ENV"
          echo "HOS_SDK_HOME=$TOOLS_DIR/sdk" >> "$GITHUB_ENV"
          chmod -R +x "$TOOLS_DIR/bin"

      - name: Install dependencies
        run: ohpm install

      - name: Compile Hypium suite and attempt Local Test
        shell: bash
        timeout-minutes: 2
        run: |
          set +e
          timeout --signal=TERM --kill-after=5s 45s \
            hvigorw test -p module=entry -p coverage=false --no-daemon 2>&1 | tee local-test.log
          status=${PIPESTATUS[0]}
          set -e

          result='entry/.test/default/intermediates/test/coverage_data/test_result.txt'
          if [[ -s "$result" ]]; then
            echo '--- HarmonyOS Local Test result ---'
            cat "$result"
          fi

          if [[ "$status" == '0' ]]; then
            echo 'HarmonyOS Local Test executed successfully.'
            exit 0
          fi

          # Huawei's Linux previewer stalls immediately after UnitTestArkTS;
          # still require the full existing Hypium suite to compile cleanly.
          if [[ "$status" == '124' || "$status" == '137' ]]; then
            if grep -Fq 'Finished :entry:default@UnitTestArkTS' local-test.log && \
               ! grep -Eq 'ArkTS:ERROR|ERROR:|BUILD FAILED|FAILED:|hvigor.*ERROR' local-test.log; then
              echo 'Linux HarmonyOS previewer did not execute assertions; all Hypium test sources compiled successfully.'
              echo 'Assertion execution remains a Windows/macOS/device validation requirement.'
              exit 0
            fi
          fi

          echo "Hypium validation failed with status $status." >&2
          exit "$status"

      - name: Build HAP
        run: hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon

      - name: Upload unsigned HAP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: papertodo-harmonyos-debug
          if-no-files-found: error
          path: '**/build/**/outputs/**/*.hap'
