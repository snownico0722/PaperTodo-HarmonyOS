name: HarmonyOS Build

on:
  push:
    branches:
      - main
      - fix/v332-capsule-host
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harmonyos-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned HAP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch association drag source
        if: github.ref == 'refs/heads/fix/v332-capsule-host'
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('entry/src/main/ets/pages/Paper.ets')
          text = path.read_text()
          pattern = re.compile(
              r"(?m)^            Text\(this\.isPaperLinked\(\) \? '⦿' : '⌖'\)\n"
              r"(?:^              .*\n){8}"
              r"^              \.onDragStart\(\(event: DragEvent\): DragItemInfo => this\.beginPaperLinkDrag\(event\)\)\n"
          )
          replacement = """            Stack({ alignContent: Alignment.Center }) {
              Text(this.isPaperLinked() ? '⦿' : '⌖')
                .fontSize(13)
                .fontColor(this.textColor())
                .textAlign(TextAlign.Center)
            }
              .id('paper_link_drag_handle')
              .width(26)
              .height(30)
              .accessibilityText(this.text('link.to'))
              .draggable(true)
              .dragPreview('paper_link_drag_handle')
              .onDragStart((event: DragEvent): DragItemInfo => this.beginPaperLinkDrag(event))
"""
          next_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('paper link drag source match count=' + str(count))
          path.write_text(next_text)
          PY
          git diff --check -- entry/src/main/ets/pages/Paper.ets
          git diff -- entry/src/main/ets/pages/Paper.ets

      - name: Persist patch and restore normal CI
        if: github.ref == 'refs/heads/fix/v332-capsule-host'
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main --depth=1
          git checkout FETCH_HEAD -- .github/workflows/harmonyos-build.yml
          git rm -f .github/workflows/v332-probe.yml || true
          git config user.name "PaperTodo CI"
          git config user.email "actions@users.noreply.github.com"
          git add entry/src/main/ets/pages/Paper.ets .github/workflows
          git status --short
          git commit -m "fix: use custom UDMF paper drag source"
          git push origin HEAD:fix/v332-capsule-host

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache HarmonyOS Command Line Tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: command-line-tools
          key: ${{ runner.os }}-harmonyos-cli-6.1.0.816
          save-always: true

      - name: Download HarmonyOS Command Line Tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 \
            --output tools.zip \
            https://github.com/Okysu/harmony-auto-build/releases/download/commandline-tools-linux-x64-6.1.0.816/commandline-tools-linux-x64-6.1.0.816.zip
          echo "4b21e8a4ce19fc7eb381425a570e936c80067b8a0bef9cdcfe8a49e4764038e2  tools.zip" | sha256sum --check -
          unzip -q tools.zip
          rm tools.zip

      - name: Setup HarmonyOS build environment
        shell: bash
        run: |
          TOOLS_DIR="$GITHUB_WORKSPACE/command-line-tools"
          echo "hwsdk.dir=$TOOLS_DIR/sdk" > local.properties
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "OHPM_HOME=$TOOLS_DIR/ohpm" >> "$GITHUB_ENV"
          echo "HOS_SDK_HOME=$TOOLS_DIR/sdk" >> "$GITHUB_ENV"
          chmod -R +x "$TOOLS_DIR/bin"

      - name: Install dependencies
        run: ohpm install

      - name: Build HAP
        run: hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon

      - name: Upload unsigned HAP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: papertodo-harmonyos-v332-compile-check
          if-no-files-found: error
          path: '**/build/**/outputs/**/*.hap'
