name: V334 Changelog Rolling Patch

on:
  push:
    branches:
      - fix/v334-rolling-release-certs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct 3.3.4 signing notes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          old1 = '- 正式签名改为持久发布身份 `PaperTodo-Release-Stable-v1`：受信 runner 从受保护 AGC 服务账号密钥通过版本化 HMAC 稳定派生同一 P-256 私钥，并长期复用同一 AGC Release 证书 / Profile；不再每次构建消耗一个传统证书槽位。首次迁移只允许精确回收已被后续版本取代的 3.3.1 旧 Release 对，3.3.2 / 3.3.3 不自动删除。'
          old2 = '- 正式签名增加公钥一致性门禁；若 AGC 服务账号密钥轮换导致派生私钥变化，流水线直接失败并要求显式迁移，不会静默替换现有稳定签名身份。'
          new1 = '- 正式签名恢复为已连续验证成功的 keytool 一次发布密钥 / CSR + AGC Release 证书 / Profile 路径；不再尝试从 Service Account 密钥派生应用发布私钥。'
          new2 = '- 新增传统 Release 证书滚动槽位管理：账号达到证书上限时，仅回收命名符合 `PaperTodo-Release-<semver>-...` 的最老 CI 发布对，严格按 Profile 先删、证书后删，并至少保留最新一套既有 PaperTodo Release 身份；不删除无关证书。HarmonyOS 跨版本更新继续由同一 AGC 应用的 `appIdentifier` 保持一致性。'
          if old1 not in text or old2 not in text:
              raise SystemExit('3.3.4 signing changelog markers missing')
          path.write_text(text.replace(old1, new1, 1).replace(old2, new2, 1))
          PY
      - name: Commit patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PaperTodo CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/v334-changelog-rolling-patch.yml
          git add CHANGELOG.md
          git diff --check
          git commit -m "docs: correct 3.3.4 rolling release signing notes"
          git push origin HEAD:fix/v334-rolling-release-certs
