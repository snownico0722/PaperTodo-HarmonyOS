name: V334 Source Patch

on:
  push:
    branches:
      - fix/v334-lifecycle-signing-tests

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          master = Path('entry/src/main/ets/pages/MasterCapsule.ets')
          text = master.read_text()
          replacements = {
              "  @StorageLink('uiLanguage') uiLanguage: string = 'system';":
                  "  @StorageLink('uiLanguage') @Watch('onLayoutChanged') uiLanguage: string = 'system';",
              "  @StorageLink('systemLanguage') systemLanguage: string = 'zh-CN';":
                  "  @StorageLink('systemLanguage') @Watch('onLayoutChanged') systemLanguage: string = 'zh-CN';",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'MasterCapsule marker missing: {old}')
              text = text.replace(old, new, 1)
          master.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          prefix = '# Changelog\n\n'
          if not text.startswith(prefix):
              raise SystemExit('CHANGELOG header missing')
          section = '''## 3.3.4 — 2026-09-02

第四轮 HarmonyOS PC / 2in1 真机收敛，修复 3.3.3 审查发现的生命周期与发布门禁问题。

- `ManagerAbility` 仅在冷启动时启动一次后台 `EntryAbility`；任务栏 / singleton `onNewWant` / `onForeground` 不再重复启动隐藏 UIAbility，设置窗口恢复改为单通道串行处理，避免后台宿主反向抢占前台焦点。
- `EntryAbility` 在后续 `onNewWant` / `onForeground` 被系统复用时立即重新 `hideAbility()`；Recovery 状态独立保留，避免透明后台窗口成为最终前台 mission。
- 正式签名改为持久发布身份 `PaperTodo-Release-Stable-v1`：受信 runner 从受保护 AGC 服务账号密钥通过版本化 HMAC 稳定派生同一 P-256 私钥，并长期复用同一 AGC Release 证书 / Profile；不再每次构建消耗一个传统证书槽位。首次迁移只允许精确回收已被 3.3.4 取代的 3.3.1 旧 Release 对，3.3.2 / 3.3.3 不自动删除。
- 正式签名增加公钥一致性门禁；若 AGC 服务账号密钥轮换导致派生私钥变化，流水线直接失败并要求显式迁移，不会静默替换现有稳定签名身份。
- `HarmonyOS Build` 与正式发布流水线都先执行现有 Hypium 本地单元测试，再进行 HAP / APP 组装；签名脚本同时执行 shell 语法门禁。
- 主胶囊对 `uiLanguage` / `systemLanguage` 增加布局监听，运行中切换语言后会立即重新测量本地化主胶囊宽度。
- 版本更新为 `3.3.4`（`versionCode: 3030400`，`buildVersion: 1`）。

'''
          if '## 3.3.4 — 2026-09-02' not in text:
              text = prefix + section + text[len(prefix):]
          changelog.write_text(text)
          PY
      - name: Commit source patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PaperTodo CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/v334-source-patch.yml
          git add entry/src/main/ets/pages/MasterCapsule.ets CHANGELOG.md
          git diff --check
          git commit -m "fix: refresh localized capsule width and document 3.3.4"
          git push origin HEAD:fix/v334-lifecycle-signing-tests
