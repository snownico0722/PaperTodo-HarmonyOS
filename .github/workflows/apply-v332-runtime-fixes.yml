name: Apply v3.3.2 runtime fixes

on:
  push:
    branches:
      - fix/v332-capsule-host

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'fix: finish v3.3.2 runtime fixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runtime paths
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # 1. A single top-level capsule host owns every edge row. Do not create
          # one specified UIAbility/mission per paper capsule anymore.
          path = Path('entry/src/main/ets/common/DesktopShell.ets')
          text = path.read_text()
          old = """    const hasMaster: boolean = enabled && state.useMasterCapsule && members.length > 0;
    let capsuleReachable: boolean = false;
    if (hasMaster) {
      capsuleReachable = await DesktopShell.startMaster(context, PAPER_COMMAND_SHOW);
    } else if (AppStorage.get<boolean>('masterCapsuleOpen') === true) {
      await DesktopShell.startMaster(context, PAPER_COMMAND_CLOSE);
    }
"""
          new = """    // MasterCapsuleAbility is now the single host for the entire right-edge queue.
    // It stays alive even when the optional master row itself is disabled.
    const hasCapsuleHost: boolean = enabled && members.length > 0;
    let capsuleReachable: boolean = false;
    if (hasCapsuleHost) {
      capsuleReachable = await DesktopShell.startMaster(context, PAPER_COMMAND_SHOW);
    } else if (AppStorage.get<boolean>('masterCapsuleOpen') === true) {
      await DesktopShell.startMaster(context, PAPER_COMMAND_CLOSE);
    }
"""
          if old not in text:
              raise SystemExit('DesktopShell master block not found')
          text = text.replace(old, new, 1)
          old = """      const capsuleEligible: boolean = PaperStore.canPaperDisplayAsCapsule(paper);
      const queueMember: boolean = enabled && capsuleEligible && paper.isVisible &&
        (paper.isCollapsed || state.showDeepCapsuleWhileExpanded);
      if (queueMember) {
        operations.push(DesktopShell.startEdge(context, paper.id, PAPER_COMMAND_SHOW));
      } else if (AppStorage.get<boolean>('edgeCapsuleOpen:' + paper.id) === true) {
        operations.push(DesktopShell.startEdge(context, paper.id, PAPER_COMMAND_CLOSE));
      }

"""
          new = """      const capsuleEligible: boolean = PaperStore.canPaperDisplayAsCapsule(paper);
      // v3.3.1 used one specified EdgeCapsuleAbility for every row. Besides creating
      // extra missions, that made queue visibility depend on cross-UIAbility state.
      // Close any legacy live instance, but never create a new edge-row ability.
      if (AppStorage.get<boolean>('edgeCapsuleOpen:' + paper.id) === true) {
        operations.push(DesktopShell.startEdge(context, paper.id, PAPER_COMMAND_CLOSE));
      }

"""
          if old not in text:
              raise SystemExit('DesktopShell edge block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          # 2. A taskbar/mission activation can foreground the existing singleton
          # without delivering the launcher Want along the path we relied on.
          # Treat foreground of an already bootstrapped hidden EntryAbility as the
          # launcher action and coalesce it with onNewWant.
          path = Path('entry/src/main/ets/entryability/EntryAbility.ets')
          text = path.read_text()
          old = """  private launchGeneration: number = 0;
  private recoveryVisible: boolean = false;
"""
          new = """  private launchGeneration: number = 0;
  private recoveryVisible: boolean = false;
  private bootstrapComplete: boolean = false;
  private reactivationInFlight: boolean = false;
  private lastReactivationAt: number = 0;
"""
          if old not in text:
              raise SystemExit('Entry fields not found')
          text = text.replace(old, new, 1)
          old = """  onNewWant(want: Want, launchParam: AbilityConstant.LaunchParam): void {
    const generation: number = ++this.launchGeneration;
    this.handleLauncherReactivation(generation).catch((error: Error): void => {
      console.error('handle launcher reactivation failed: ' + error.message);
    });
  }
"""
          new = """  onNewWant(want: Want, launchParam: AbilityConstant.LaunchParam): void {
    this.requestLauncherReactivation();
  }
"""
          if old not in text:
              raise SystemExit('Entry onNewWant not found')
          text = text.replace(old, new, 1)
          old = """  onForeground(): void {
    this.applyHiddenHostStyle();
  }
"""
          new = """  onForeground(): void {
    this.applyHiddenHostStyle();
    // Moving an existing mission to the foreground is a distinct PC/2-in-1
    // activation path. It must open Settings even when no useful onNewWant arrives.
    this.requestLauncherReactivation();
  }
"""
          if old not in text:
              raise SystemExit('Entry onForeground not found')
          text = text.replace(old, new, 1)
          old = """    // Keep this singleton as an invisible launcher target. Terminating it
    // makes a taskbar/launcher click cold-bootstrap the app again instead of
    // delivering onNewWant, so Settings can never be reached from that icon.
    await this.hideLauncherHost();
  }

  private async handleLauncherReactivation(generation: number): Promise<void> {
"""
          new = """    // Keep this singleton as an invisible launcher target. It is the only
    // mission whose foreground activation has the product meaning "open Settings".
    this.bootstrapComplete = true;
    await this.hideLauncherHost();
  }

  private requestLauncherReactivation(): void {
    if (!this.bootstrapComplete || this.recoveryVisible) {
      return;
    }
    const now: number = Date.now();
    if (this.reactivationInFlight || now - this.lastReactivationAt < 300) {
      return;
    }
    this.lastReactivationAt = now;
    this.reactivationInFlight = true;
    const generation: number = ++this.launchGeneration;
    this.handleLauncherReactivation(generation).then((): void => {
      this.reactivationInFlight = false;
    }).catch((error: Error): void => {
      this.reactivationInFlight = false;
      console.error('handle launcher reactivation failed: ' + error.message);
    });
  }

  private async handleLauncherReactivation(generation: number): Promise<void> {
"""
          if old not in text:
              raise SystemExit('Entry bootstrap tail not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          # 3. Do not use Text's native text-drag path as the paper association
          # handle. Use a custom Stack drag source like the ArkUI UDMF examples.
          path = Path('entry/src/main/ets/pages/Paper.ets')
          text = path.read_text()
          old = """            Text(this.isPaperLinked() ? '⦿' : '⌖')
              .width(26)
              .height(30)
              .fontSize(13)
              .fontColor(this.textColor())
              .textAlign(TextAlign.Center)
              .accessibilityText(this.text('link.to'))
              .copyOption(CopyOptions.LocalDevice)
              .draggable(true)
              .onDragStart((event: DragEvent): DragItemInfo => this.beginPaperLinkDrag(event))
"""
          new = """            Stack({ alignContent: Alignment.Center }) {
              Text(this.isPaperLinked() ? '⦿' : '⌖')
                .fontSize(13)
                .fontColor(this.textColor())
                .textAlign(TextAlign.Center)
            }
              .id('paper_link_drag_handle')
              .width(26)
              .height(30)
              .accessibilityText(this.text('link.to'))
              .draggable(true)
              .dragPreview('paper_link_drag_handle')
              .onDragStart((event: DragEvent): DragItemInfo => this.beginPaperLinkDrag(event))
"""
          if old not in text:
              raise SystemExit('Paper link drag source not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          # 4. Version the device regression build so it can replace 3.3.1.
          path = Path('AppScope/app.json5')
          text = path.read_text()
          text = text.replace('"versionCode": 3030100', '"versionCode": 3030200')
          text = text.replace('"versionName": "3.3.1"', '"versionName": "3.3.2"')
          text = text.replace('"buildVersion": "1"', '"buildVersion": "1"')
          path.write_text(text)

          path = Path('CHANGELOG.md')
          text = path.read_text()
          heading = """## 3.3.2 — 2026-09-02

第二轮 HarmonyOS PC 真机回归修复。3.3.1 对胶囊窗口边界和任务栏激活的判断不成立，本版改为平台语义上的结构修复：

- 右侧主胶囊与所有普通胶囊改由一个顶层胶囊宿主窗口承载，不再为每张普通胶囊创建独立 `specified UIAbility` / mission。
- 胶囊宿主窗口只在成员数量、队列起点或可用工作区变化时调整几何；主胶囊收起/展开仅动画内部 ArkUI 行，不改变顶层窗口 X 或宽度。
- 几何同步优先使用 `resizeAsync()` / `moveWindowToAsync()`，并缓存最终矩形，避免异步窗口操作互相覆盖。
- 纸片关联拖动柄由 `Text` 原生文本拖拽改为自定义 `Stack.draggable(true)` + UDMF `onDragStart`，并提供稳定拖拽预览。
- 隐藏的 `EntryAbility` 在完成启动后同时处理 `onNewWant` 与 `onForeground` 的任务栏/mission 激活，统一打开设置窗口。
- 版本更新为 `3.3.2`（`versionCode: 3030200`）。

"""
          if '## 3.3.2 — 2026-09-02' not in text:
              text = '# Changelog\n\n' + heading + text.removeprefix('# Changelog\n\n')
          path.write_text(text)
          PY

      - name: Remove one-shot workflow
        run: git rm .github/workflows/apply-v332-runtime-fixes.yml
      - name: Commit patched sources
        run: |
          git config user.name "PaperTodo CI"
          git config user.email "actions@users.noreply.github.com"
          git add entry AppScope CHANGELOG.md
          git commit -m "fix: finish v3.3.2 runtime fixes"
          git push origin HEAD:fix/v332-capsule-host
